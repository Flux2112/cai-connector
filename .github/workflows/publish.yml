name: Publish

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Lets the runner mint a GitHub OIDC token, which Entra ID exchanges for
      # an access token. This is what replaces the long-lived Marketplace PAT.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Node 24, not 20: npm trusted publishing needs npm >= 11.5.1 and Node >=
      # 22.14.0, and Node 20 ships npm 10, which cannot do OIDC publishing at
      # all. This is the build runner only — it does not change the extension's
      # engines.vscode target or its compiled output.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # A lockfile written behind a private mirror carries that mirror's tarball
      # URLs, and this runner cannot reach the host — npm ci then dies with a TLS
      # error naming a certificate rather than the real cause, four steps before
      # anything that could explain it. Invisible on the machine that wrote the
      # lockfile, because there the host resolves fine. It cost one failed
      # release; the check is a grep.
      - name: Check the lockfile targets the public registry
        run: |
          if grep '"resolved": "https://' package-lock.json | grep -v 'registry\.npmjs\.org'; then
            echo "::error::package-lock.json resolves packages from a non-public registry (listed above). Regenerate it with --registry=https://registry.npmjs.org and commit it."
            exit 1
          fi

      - name: Install deps
        run: npm ci

      - name: Compile
        run: npm run compile

      # npm test type-checks every package and runs its suite. Worth having in
      # front of a publish now that core and cli carry real network-layer
      # coverage; the extension's 131 tests come along for free.
      - name: Test
        run: npm test

      # The spec lives on an internal host this runner can never reach, so both
      # the spec and the types generated from it are committed. Regeneration is
      # deterministic, so this is a genuine drift check: it fails if the
      # committed types no longer match the committed spec.
      - name: Check generated types are current
        run: npm run generate -w @defysoftware/cai-core -- --check

      # Signs the Azure CLI in via workload identity federation: no secret is
      # stored, the runner proves its identity with a short-lived OIDC token.
      # allow-no-subscriptions keeps this working if the identity is never given
      # a role on a subscription — publishing needs a token for the Azure DevOps
      # resource, not access to any Azure resource.
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      # Byte-for-byte the call vsce's AzureCliCredential makes, so a pass here
      # means the publish step will authenticate. Runs before the version bump
      # so a broken federation cannot leave a bumped version and a pushed tag
      # with no release behind them. Prints the expiry only, never the token.
      - name: Verify Marketplace credential
        run: |
          az account get-access-token \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query expiresOn -o tsv

      # Every package takes the same version, equal to the tag, so core and the
      # extension stay version-locked once they share code.
      #
      # The `npm pkg set` line is not tidiness: `npm version --workspaces` bumps
      # each package but leaves inter-workspace dependency ranges alone, so
      # without it the cli would publish at 1.n depending on cai-core 1.n-1 — a
      # version that was never published, making the published cli
      # uninstallable. Verified, not assumed.
      - name: Bump version
        run: |
          # --no-workspaces-update is what makes this step work at all. Left on,
          # npm re-resolves the tree the moment the bump lands, while the cli
          # still pins the *previous* cai-core: the workspace no longer
          # satisfies that pin, so npm asks the registry for a version that was
          # never published and fails with ETARGET. The pin cannot be fixed
          # before the bump either, since the new version is only known after
          # it, so the lockfile refresh has to wait for both.
          npm version minor --no-git-tag-version --workspaces --no-workspaces-update
          VERSION=$(node -p "require('./packages/extension/package.json').version")
          npm pkg set "dependencies.@defysoftware/cai-core=${VERSION}" -w @defysoftware/cai
          # Every version now agrees, so the lockfile can be brought in line —
          # and must be: it records each workspace's version, so leaving it at
          # the old one publishes a tag whose npm ci fails on a lockfile that
          # disagrees with the manifests beside it.
          npm install --package-lock-only
          node -e "
            const cli = require('./packages/cli/package.json');
            const core = require('./packages/core/package.json');
            const ext = require('./packages/extension/package.json');
            const versions = new Set([cli.version, core.version, ext.version, cli.dependencies['@defysoftware/cai-core']]);
            if (versions.size !== 1) throw new Error('versions out of step: ' + [...versions].join(', '));
            console.log('all packages at ' + [...versions][0]);
          "

      # This has to run AFTER the bump and BEFORE anything is pushed, and both
      # halves of that are load-bearing.
      #
      # After the bump, because a dry run of an *already published* version dies
      # with EPUBLISHCONFLICT — "You cannot publish over the previously published
      # versions" — and before the bump the version is exactly the one the last
      # release published. That passed while nothing had ever been published at
      # the current version and failed on the very next release; reproduced
      # locally in node:24-slim, where the same dry run conflicts at the old
      # version and succeeds at the bumped one.
      #
      # Before the push, because that is what the guard is for: the bump so far
      # is a local file edit, so a broken credential here leaves no pushed
      # commit and no tag behind with no release.
      #
      # `npm publish --dry-run`, not `npm whoami`. Checked against npm 11's
      # source rather than assumed: publish.js calls the OIDC token exchange
      # unconditionally *before* it branches on --dry-run, so a dry run really
      # does prove the trusted publisher is configured and the runner's identity
      # is accepted. `npm whoami` goes through getIdentity, which only reads a
      # token from .npmrc — with trusted publishing there is no token, so it
      # would fail every time and prove nothing.
      #
      # It also runs the cli's prepack, so a broken `oclif manifest` surfaces
      # here rather than half way through a release.
      - name: Verify npm credential and packability
        run: |
          npm publish -w @defysoftware/cai-core --access public --dry-run
          npm publish -w @defysoftware/cai      --access public --dry-run

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump minor version [skip ci]"
          git pull --rebase
          git push

      - name: Git tag
        run: |
          VERSION=$(node -p "require('./packages/extension/package.json').version")
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Package
        run: npm run package

      # vsce resolves an Entra ID token through its credential chain, which
      # picks up the Azure CLI session established above. Requires vsce >= 2.26.1.
      #
      # --no-dependencies is load-bearing in a workspace: `npm ls --omit=dev
      # --parseable --all` run inside packages/extension reports the workspace
      # ROOT as a dependency path, so vsce would otherwise glob the whole repo
      # and fail on paths escaping the package dir. The extension has no runtime
      # dependencies, so there is nothing for vsce to collect anyway.
      - name: Publish
        run: npx vsce publish --azure-credential --no-dependencies
        working-directory: packages/extension

      # npm trusted publishing: the npm CLI detects the OIDC environment (the
      # same `id-token: write` permission Azure uses above) and authenticates
      # with it before falling back to any token, so there is no NPM_TOKEN
      # secret. Provenance attestations are generated automatically, which is
      # why there is no --provenance flag.
      #
      # core first: the cli pins it exactly, so publishing the dependent first
      # would leave a window where `npm install @defysoftware/cai` cannot
      # resolve.
      - name: Publish cai-core to npm
        run: npm publish -w @defysoftware/cai-core --access public

      - name: Publish cai to npm
        run: npm publish -w @defysoftware/cai --access public

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: 'packages/extension/*.vsix'
